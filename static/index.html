<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QubexaIndiaGPT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        .chat-header {
            padding: 18px 24px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .status-badge {
            font-size: 0.8rem;
            color: #4ade80;
            background: rgba(169, 164, 179, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(74, 222, 128, 0.3);
            color:darkgoldenrod;
        }

        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .message {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background: #2563eb;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: #334155;
            color: #e2e8f0;
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 18px 24px;
            background: #0f172a;
            border-top: 1px solid #334155;
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 14px 18px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #38bdf8;
        }

        .send-btn {
            background:#38bdf8;
            color: #0f172a;
            border: none;
            padding: 0 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .send-btn:hover {
            background:#0ea5e9;
        }

        .send-btn:active {
            transform: scale(0.97);
        }

        .typing-indicator {
            align-self: flex-start;
            font-size: 0.85rem;
            color:#94a3b8;
            font-style: italic;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>QubexaIndiaGPT</h1>
        <span class="status-badge">● Online</span>
    </div>

    <div class="chat-messages" id="chatBox">
        <div class="message bot-message">
            hello i am <strong>QubexaIndiaGPT</strong> how Can i help you...
        </div>
    </div>

    <div class="typing-indicator" id="typingIndicator" style="padding: 0 24px 8px;">
        QubexaIndiaGPT Asking...
    </div>

    <div class="chat-input-area">
        <input 
            type="text" 
            id="userInput" 
            class="chat-input" 
            placeholder="Here WE Type..." 
            autocomplete="off"
            onkeypress="handleKeyPress(event)"
        />
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const typingIndicator = document.getElementById("typingIndicator");

    function appendMessage(text, sender) {
        const messageDiv = document.createElement("div");
        messageDiv.classList.add("message", sender === "user" ? "user-message" : "bot-message");
        messageDiv.innerHTML = text;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const query = userInput.value.trim();
        if (!query) return;

        appendMessage(query, "user");
        userInput.value = "";
        typingIndicator.style.display = "block";
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();
            typingIndicator.style.display = "none";
            appendMessage(data.answer, "bot");
        } catch (error) {
            typingIndicator.style.display = "none";
            appendMessage("I do not connect to Server", "bot");
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
